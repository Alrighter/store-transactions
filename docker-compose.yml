services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: ch
    ports:
      - "8123:8123"
      - "9000:9000"
    ulimits:
      nofile: 
        soft: 262144
        hard: 262144
    environment:
      - CLICKHOUSE_USER=sa
      - CLICKHOUSE_PASSWORD=password123
    volumes:
      - ch_data:/var/lib/clickhouse
      - ./data:/data
    
  postgres:
    image: postgres:16
    container_name: pg
    ports: ["5432:5432"]
    environment:
      - POSTGRES_USER=sa
      - POSTGRES_PASSWORD=password123
      - POSTGRES_DB=store-transactions
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./data:/data

volumes:
  ch_data:
  pg_data: